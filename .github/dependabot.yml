# Version updates once a month, only for releases at least 14 days old: one
# grouped PR per ecosystem for minor and patch updates, and a PR of its own
# for each major. Security updates are not held back by the cooldown.
#
# Neither ecosystem's PRs release anything. Python dependency PRs are
# `chore(deps):` because they usually change only uv.lock, which isn't part of
# the published package: users resolve versions from the ranges in
# pyproject.toml. When one changes those ranges (e.g. a new major of a runtime
# dependency), retitle it `deps:` so release-please releases it. GitHub
# Actions PRs are `ci(deps):`: they never reach the package's users.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
