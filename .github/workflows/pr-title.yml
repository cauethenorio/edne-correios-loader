# PR titles must follow Conventional Commits: the repo squash-merges, so the
# title becomes the commit release-please reads to pick the next version and
# write the changelog (feat -> minor, fix -> patch, `!` -> major).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        with:
          # The types release-please knows: feat, fix, perf, deps, revert and
          # docs release; the others don't
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            chore
            refactor
            test
            build
            ci
            style
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
