# Started by the GitHub Release that release-please creates when its release PR
# is merged (see release-please.yml). The file name and the `pypi`
# environment are what PyPI's trusted publisher is bound to: keep both.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/edne-correios-loader
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Build and publish to PyPI
      run: make publish
